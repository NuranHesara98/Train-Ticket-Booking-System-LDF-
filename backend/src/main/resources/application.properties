spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/train_booking?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=${SERVER_PORT:8080}
app.booking.base-fare-per-station=150
app.booking.route.stations=Colombo Fort,Ragama,Polgahawela,Kandy,Nawalapitiya,Hatton,Ella,Badulla
app.booking.route.reserved-coach-count=3
app.booking.route.total-coach-count=8
app.booking.route.seats-per-coach=3
