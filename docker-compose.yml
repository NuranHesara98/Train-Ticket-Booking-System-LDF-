version: '3.9'
services:
  backend:
    build:
      context: ./backend
    container_name: seat-booking-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3307/${MYSQL_DATABASE}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SERVER_PORT: ${SERVER_PORT:-8080}
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    container_name: seat-booking-frontend
    depends_on:
      - backend
    ports:
      - "4200:4200"